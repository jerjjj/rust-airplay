[package]
name = "rust-airplay"
description = "AirPlay  receiver: the protocol, the media session and the renderer boundary"
repository = "https://github.com/jerjjj/rust-airplay"
readme = "README.md"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "README.zh-CN.md"]
keywords = ["airplay", "raop", "mirroring", "receiver", "uxplay"]
categories = ["multimedia", "network-programming"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
cipher = "0.4"
ctr = "0.9"
ed25519-dalek = "2"
getrandom = "0.2"
md-5 = "0.10"
log = "0.4"
mdns-sd = "0.21.4"
num-bigint = "0.4"
num-traits = "0.2"
plist = { version = "1.8.0", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
x25519-dalek = "2"

[dev-dependencies]
proptest = "1.11.0"

