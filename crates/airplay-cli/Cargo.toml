[package]
name = "airplay-cli"
description = "Development tools for the Rust AirPlay receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rust-airplay"
path = "src/main.rs"

[dependencies]
airplay-core = { path = "../airplay-core" }
getrandom = "0.2"
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

