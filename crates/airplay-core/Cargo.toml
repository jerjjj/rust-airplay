[package]
name = "airplay-core"
description = "Safe Rust protocol primitives for an UxPlay-compatible AirPlay receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
cbc = "0.1"
cipher = "0.4"
ctr = "0.9"
ed25519-dalek = "2"
getrandom = "0.2"
md-5 = "0.10"
mdns-sd = "0.21.4"
num-bigint = "0.4"
num-traits = "0.2"
plist = { version = "1.8.0", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
x25519-dalek = "2"

