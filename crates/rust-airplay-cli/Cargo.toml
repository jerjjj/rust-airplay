[package]
name = "rust-airplay-cli"
description = "Development tools for the Rust AirPlay receiver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rust-airplay"
path = "src/main.rs"

[features]
default = []
# What a session plays through, off by default so a machine with no GStreamer builds and
# tests this workspace unchanged. `--render null` is the backend that reads media and plays
# nothing, and it is always there: `docs/ARCHITECTURE.md` records why the
# GStreamer one is a feature, and `crates/airplay-renderer-gst/README.md` says how to run it.
# The `tokio` features come with it because only that path needs a channel for `SETUP` to
# hand a session its keys, and a signal that ends the receive loops when the control plane
# stops; a default build pulls in neither.
gst = ["dep:rust-airplay-gstreamer", "tokio/sync", "tokio/signal"]

[dependencies]
rust-airplay = { path = "../rust-airplay" }

rust-airplay-gstreamer = { path = "../rust-airplay-gstreamer", optional = true }
getrandom = "0.2"
log = "0.4"
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
