[package]
name = "airplay-renderer-gst"
description = "GStreamer backend for the AirPlay renderer boundary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "airplay_renderer_gst"
path = "src/lib.rs"

# A workspace of its own, on purpose: this crate needs a GStreamer runtime to be useful,
# and a machine without one must still be able to run the default workspace's gates.
# `docs/ADR-0003-media-backend.md` records the decision and `README.md` in this directory
# says how to build and test it.
[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
airplay-renderer = { path = "../airplay-renderer" }
