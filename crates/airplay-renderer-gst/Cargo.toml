[package]
name = "airplay-renderer-gst"
description = "GStreamer backend for the AirPlay renderer boundary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "airplay_renderer_gst"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
airplay-renderer = { path = "../airplay-renderer" }
