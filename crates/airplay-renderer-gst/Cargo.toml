[package]
name = "airplay-renderer-gst"
description = "GStreamer backend for the AirPlay renderer boundary"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "airplay_renderer_gst"
path = "src/lib.rs"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"

[dependencies]
airplay-renderer = { path = "../airplay-renderer" }
# Linked rather than run as a subprocess, because audio needs `appsrc` — one buffer per
# frame — and a `gst-launch` pipeline fed bytes on stdin cannot express where a frame ends
# (see `src/audio.rs`). Video is still a subprocess: H.264 has start codes, so a byte
# stream carries its own framing.
gstreamer = "0.24"
gstreamer-app = "0.24"

