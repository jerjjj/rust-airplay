[workspace]
# The GStreamer backend is a member so that the CLI can depend on it behind a feature
# ("gst", off by default): a machine with no GStreamer still builds, tests and lints this
# workspace unchanged, and a machine that has one asks for it explicitly. That is the
# isolation `docs/ADR-0003-media-backend.md` requires, and the crate's README says how to
# run what needs a runtime.
members = [
    "crates/airplay-core",
    "crates/airplay-cli",
    "crates/airplay-renderer",
    "crates/airplay-renderer-gst",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
