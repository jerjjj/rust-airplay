[workspace]
# The GStreamer backend is **not** a member: its audio path links `libgstreamer`, so
# building it needs the GStreamer development files, and a machine without them must still
# be able to run every gate here (`docs/ARCHITECTURE.md` rules 5 and 6). It is
# excluded rather than merely unlisted because the CLI depends on it by path, and it is
# built by asking for that feature:
#
#   cargo build -p airplay-cli --features gst
#   cargo test --manifest-path crates/airplay-renderer-gst/Cargo.toml
members = [
    "crates/rust-airplay",
    "crates/rust-airplay-cli",
]
exclude = ["crates/rust-airplay-gstreamer"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
