[workspace]
members = ["crates/airplay-core", "crates/airplay-cli", "crates/airplay-renderer"]
# The GStreamer backend is a member of a workspace of its own: it needs a GStreamer
# runtime to be useful, and a machine without one must still be able to run this
# workspace's gates. `crates/airplay-renderer-gst/README.md` says how to build it and
# `docs/ADR-0003-media-backend.md` records why it is shaped this way.
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

